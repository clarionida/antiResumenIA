# Publica la carpeta site/ en GitHub Pages (gratis en repositorios públicos).
# Una sola vez: Settings → Pages → Build and deployment → Source: «GitHub Actions».
#
# Son dos trabajos separados a propósito: «build» empaqueta la página y «deploy»
# la publica cuando el paquete ya está disponible. En un solo trabajo, a veces
# GitHub todavía no ve el paquete recién subido y la publicación falla con
# «No artifacts named github-pages were found».
name: Publicar página web

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
